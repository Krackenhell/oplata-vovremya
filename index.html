<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="description" content="Оплата вовремя — ИИ-помощник для бизнеса: находит, почему клиент не платит, и что сделать, чтобы получить деньги.">
  <title>Оплата вовремя</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="web/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/today" aria-label="Оплата вовремя, главная">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="3"/><path d="M16 8v8l5 4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span>
      <span>Оплата<br>вовремя</span>
    </a>
    <div class="company" id="company"></div>
    <nav aria-label="Разделы" id="nav">
      <a href="#/today" data-view="today"><i>◎</i>Сегодня</a>
      <a href="#/invoices" data-view="invoices"><i>▤</i>Счета <b id="nav-late"></b></a>
      <a href="#/reconcile" data-view="reconcile"><i>⇄</i>Сверка выписки <b id="nav-rec"></b></a>
      <a href="#/money" data-view="money"><i>₽</i>Деньги сейчас</a>
      <a href="#/tasks" data-view="tasks"><i>✓</i>Мои действия <b id="nav-tasks"></b></a>
      <div class="nav-sep">Прозрачность</div>
      <a href="#/quality" data-view="quality"><i>◇</i>Качество ИИ</a>
      <a href="#/bank" data-view="bank"><i>▦</i>Для банка</a>
      <a href="#/how" data-view="how"><i>?</i>Как это работает</a>
    </nav>
    <div class="side-foot">
      <div id="mode-badge" class="mode"></div>
      <label class="noai"><input type="checkbox" id="noai"> Работать без ИИ</label>
      <a href="https://github.com/Krackenhell/oplata-vovremya" target="_blank" rel="noopener">Исходный код ↗</a>
    </div>
  </aside>
  <main id="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Меню">☰</button>
      <div class="crumbs" id="crumbs"></div>
      <div class="top-actions">
        <span class="asof">на <b id="asof"></b></span>
        <button class="btn ghost" id="import-btn">Загрузить данные</button>
        <button class="btn ghost" id="reset-btn" title="Вернуть демонстрационные данные">↺</button>
      </div>
    </header>
    <div class="demo-strip" id="demo-strip"></div>
    <section id="view" tabindex="-1"></section>
  </main>
</div>

<aside class="drawer" id="drawer" aria-label="Карточка счёта" hidden></aside>
<div class="scrim" id="scrim" hidden></div>

<dialog id="dlg"><div id="dlg-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="web/js/app.js"></script>
</body>
</html>
